[package]
name = "openwith"
version = "0.1.0"
edition = "2024"
description = "CLI tool to inspect and manage default file handlers"
license = "GNU AGPLv3"
repository = "https://github.com/sabarish-vm/defapp"
readme = "README.md"
keywords = ["cli", "macos", "default-apps", "file-associations"]
categories = ["command-line-utilities"]

[dependencies]
objc2-uniform-type-identifiers = { version = "0.3", features = ["UTType"] }
objc2-foundation = { version = "0.3", features = [
    "NSURL",
    "NSArray",
    "NSString",
] }
objc2-app-kit = { version = "0.3", features = [
    "NSWorkspace",
    "objc2-uniform-type-identifiers",
] }
anyhow = "1"
objc2 = "0.6.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
clap = { version = "4", default-features = false, features = [
    "help",
    "usage",
    "suggestions",
] }
clap_complete = "4"
